apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-sample-app
  labels:
    app: java-sample-app
    env: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-sample-app
  template:
    metadata:
      labels:
        app: java-sample-app
        env: dev
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: app
        image: ghcr.io/itayna/java-sample-app:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: APP_NAME
          value: "TeraSky Java Sample - DEV"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
