apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: health-check
spec:
  args:
  - name: service-name
  metrics:
  - name: health-check
    # Runs as background analysis for the whole canary. Three consecutive
    # non-UP readings abort the rollout and scale the canary back down.
    interval: 30s
    failureLimit: 3
    successCondition: result == "UP"
    provider:
      web:
        url: http://{{args.service-name}}:8080/actuator/health
        jsonPath: "{$.status}"
