name: promote-prod
# Manual promotion gate: dev is updated automatically by the platform delivery
# pipeline, prod is only ever changed from here. Opens a PR instead of pushing to
# main so the promotion itself is reviewable and shows up in the audit trail.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to promote"
        required: true
        default: java-sample-app
      tag:
        description: "Image tag to promote (default: whatever dev is running)"
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SERVICE: ${{ inputs.service }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Resolve tag to promote
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(grep -oP 'newTag:\s*\K\S+' "environments/dev/${SERVICE}/kustomization.yaml")
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v3
      - name: Verify image signature before promoting
        # Alternation covers the migration window: images built before the pipeline
        # moved into itayna/platform-workflows carry the app repo's own workflow as
        # the certificate identity. Drop the second branch once no pre-v1 image is
        # a rollback candidate any more (see ADR-0008).
        run: |
          cosign verify "${IMAGE}:${{ steps.tag.outputs.tag }}" \
            --certificate-identity-regexp="^https://github\.com/${{ github.repository_owner }}/(platform-workflows/\.github/workflows/java-service-delivery\.yml@refs/tags/v|${SERVICE}/\.github/workflows/delivery\.yml@refs/heads/main$)" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BRANCH="promote/prod-${SERVICE}-${TAG}"
          git config user.name "promotion-bot"
          git config user.email "promotion-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i "s|newTag: .*|newTag: ${TAG}|" "environments/prod/${SERVICE}/kustomization.yaml"
          git commit -am "promote ${SERVICE}:${TAG} to prod"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "promote ${SERVICE}:${TAG} to prod" \
            --body "Signature verified against the trusted GitHub Actions OIDC identity. Merging triggers the prod Argo CD app for \`${SERVICE}\`, which rolls out via canary with background analysis."
