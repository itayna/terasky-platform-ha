kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind-prod
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 9080
    protocol: TCP
  - containerPort: 30443
    hostPort: 9443
    protocol: TCP
  - containerPort: 30800
    hostPort: 30900
    protocol: TCP
