apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that container images are signed using Cosign keyless signing
      with GitHub Actions OIDC. Blocks unsigned or unverified images.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
  - name: verify-ghcr-images
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - default
    verifyImages:
    - imageReferences:
      - "ghcr.io/itayna/java-sample-app:*"
      attestors:
      - entries:
        - keyless:
            subject: "https://github.com/itayna/java-sample-app/.github/workflows/delivery.yml@refs/heads/main"
            issuer: "https://token.actions.githubusercontent.com"
            rekor:
              url: https://rekor.sigstore.dev
