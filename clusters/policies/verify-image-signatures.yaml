apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    # Verify Pods only. With autogen on, Kyverno also generates a rule for
    # Deployment/StatefulSet/DaemonSet/CronJob, and mutateDigest rewrites the
    # *controller's* pod template to tag@sha256:... That made every dev
    # Deployment permanently drift from Git, which was papered over with an
    # `ignoreDifferences` on the image field in the dev Application — and that
    # in turn hid genuine `newTag` bumps, so Argo CD stayed "Synced", never
    # auto-synced, and automated dev promotion silently stopped deploying.
    # Pods still get signature-verified and digest-pinned at creation; the only
    # thing lost is rejection at Deployment-apply time instead of at pod
    # creation, which is already how the prod Rollout behaves (a CRD is never
    # autogen'd). See ADR-0011.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Verifies that container images are signed using Cosign keyless signing
      with GitHub Actions OIDC. Blocks unsigned or unverified images.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
  - name: verify-ghcr-images
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - default
    verifyImages:
    - imageReferences:
      - "ghcr.io/itayna/*"
      attestors:
      # count: 1 makes these alternatives, not both-required. Entry 1 is the
      # steady state: every service is built and signed by the platform's
      # reusable pipeline, so onboarding service #20 needs no policy edit —
      # which is the whole point of the golden path. Entry 2 is the migration
      # remnant for images signed by a service's own pre-v1 delivery.yml; it
      # exists so a rollback to one of those images still admits. Delete it
      # once no pre-v1 image is a rollback candidate (see ADR-0008).
      - count: 1
        entries:
        - keyless:
            subject: "https://github.com/itayna/platform-workflows/.github/workflows/java-service-delivery.yml@refs/tags/v*"
            issuer: "https://token.actions.githubusercontent.com"
            rekor:
              url: https://rekor.sigstore.dev
        - keyless:
            subject: "https://github.com/itayna/*/.github/workflows/delivery.yml@refs/heads/main"
            issuer: "https://token.actions.githubusercontent.com"
            rekor:
              url: https://rekor.sigstore.dev
