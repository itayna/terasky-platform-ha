apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __SERVICE__-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:__OWNER__/terasky-platform-ha.git
    targetRevision: main
    path: environments/dev/__SERVICE__
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
