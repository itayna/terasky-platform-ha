apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:itayna/terasky-platform-ha.git
    targetRevision: main
    path: environments/prod/_platform
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
