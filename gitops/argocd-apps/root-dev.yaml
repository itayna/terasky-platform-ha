apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:itayna/terasky-platform-ha.git
    targetRevision: main
    # App-of-apps: this directory holds one Application per service plus the
    # platform's shared primitives. It is the reason onboarding needs no
    # platform-team action — merging a PR that adds a child Application here is
    # what registers the new service. Nobody runs kubectl.
    path: gitops/argocd-apps/dev
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
