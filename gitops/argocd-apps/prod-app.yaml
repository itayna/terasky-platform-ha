apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-sample-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itayna/terasky-platform-ha.git
    targetRevision: main
    path: environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
