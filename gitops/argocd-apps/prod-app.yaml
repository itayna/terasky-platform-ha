apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-sample-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:itayna/terasky-platform-ha.git
    targetRevision: main
    path: environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  # Same Kyverno digest mutation as dev (see dev-app.yaml). On the Rollout the
  # path is the same, but the kind is argoproj.io/Rollout.
  ignoreDifferences:
  - group: argoproj.io
    kind: Rollout
    jsonPointers:
    - /spec/template/spec/containers/0/image
